name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in Arena AI
title: "[BUG]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the fields below as detailed as possible.
  - type: textarea
    id: description
    attributes:
      label: "🐛 Bug Description"
      description: |
        A clear and concise description of what the bug is.
      placeholder: |
        e.g. The app freezes when I sign in...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "🎬 Steps to Reproduce"
      description: |
        What steps did you take to encounter the issue?
      placeholder: |
        1. Open the app
        2. Go to...
        3. Swipe or tap...
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "🎯 Expected Behavior"
      description: |
        What did you expect to happen?
      placeholder: |
        The app should have completed the sign-in...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "📱 Device"
      description: |
        What device are you using?
      placeholder: "e.g. Google Pixel 8, Samsung Galaxy S23, Xiaomi 14"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: "🤖 Android Version"
      description: |
        What Android version is installed on your device?
      placeholder: "e.g. Android 14, Android 13, HyperOS"
    validations:
      required: true
  - type: dropdown
    id: app_version
    attributes:
      label: "📦 App Version"
      description: |
        Select the app version where the bug occurs.
      options:
        - "1.1.9"
        - "1.1.8"
        - "1.1.7"
        - "Older"
        - "Self-built"
    validations:
      required: true
  - type: dropdown
    id: install_source
    attributes:
      label: "📥 Installation Source"
      description: |
        Where did you install the app from?
      options:
        - "GitHub Release APK"
        - "AI Studio / Emulator"
        - "Self-compiled from Source"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "📸 Screenshots"
      description: |
        Drag and drop images or paste links here.
  - type: textarea
    id: context
    attributes:
      label: "🛠️ Additional Context"
      description: |
        Any other helpful information (logs, custom settings, environment details, etc.).
