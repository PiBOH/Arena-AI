name: Auto Release

# Same release signal as the other PiBOH repositories: a push to main whose
# commit message starts with "v" (e.g. "v1.1.9 ..."), or a manual dispatch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty = read version.txt)"
        required: false
        type: string
        default: ""
      build_type:
        description: "What to publish: signed release, debug, or both"
        required: true
        type: choice
        options:
          - release
          - debug
          - both
        default: release
      allow_unsigned:
        description: "When signing secrets are missing, publish a debug APK instead of failing"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Build only, skip publishing the release"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags-ignore: ["**"]

permissions:
  contents: write

jobs:
  release:
    name: Build APK & publish release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # version.txt holds comment lines first, so read only the value lines,
          # exactly like app/build.gradle.kts does (drop comments and blanks).
          read_value() {
            sed 's/#.*//' version.txt \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -v '^$' \
              | sed -n "${1}p"
          }
          VERSION="${VERSION_INPUT:-$(read_value 1)}"
          VERSION_CODE="$(read_value 2)"
          CHANNEL="$(read_value 3 | tr '[:upper:]' '[:lower:]')"
          VERSION="${VERSION#v}"
          VERSION="${VERSION//[[:space:]]/}"
          CHANNEL="${CHANNEL:-stable}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::version.txt does not contain a valid version."
            exit 1
          fi
          if [[ -z "$VERSION_CODE" ]]; then
            echo "::error::version.txt does not contain a valid versionCode."
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" ]]; then PRERELEASE=false; else PRERELEASE=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved v$VERSION (versionCode $VERSION_CODE, channel $CHANNEL)"

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MODE_INPUT: ${{ inputs.build_type }}
          ALLOW_UNSIGNED_INPUT: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # A v-prefixed push has no inputs: publish both variants there.
          MODE="${MODE_INPUT:-both}"
          ALLOW_UNSIGNED="${ALLOW_UNSIGNED_INPUT:-true}"
          VERSION="${{ steps.version.outputs.version }}"
          HAS_KEYSTORE=false
          [[ -n "${KEYSTORE_BASE64:-}" ]] && HAS_KEYSTORE=true

          ensure_debug_keystore() {
            # The project's debug signing config looks for ~/.android/debug.keystore,
            # which does not exist on a fresh runner: create it, or the build stops
            # in ValidateSigningTask before compiling anything.
            mkdir -p "$HOME/.android"
            if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
              keytool -genkeypair -noprompt \
                -keystore "$HOME/.android/debug.keystore" \
                -storetype JKS -alias androiddebugkey \
                -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          }

          build_release() {
            echo "Signing keystore found: building the signed release APK."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace
            REL_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
            [[ -n "$REL_APK" ]] || { echo "::error::Release APK not found."; exit 1; }
          }

          build_debug() {
            echo "Building the debug APK."
            ensure_debug_keystore
            ./gradlew assembleDebug --no-daemon --stacktrace
            DBG_APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
            [[ -n "$DBG_APK" ]] || { echo "::error::Debug APK not found."; exit 1; }
          }

          ASSETS=()
          VARIANT=""

          add_release_assets() {
            # Same signed APK under a stable name and a versioned name.
            cp "$REL_APK" "Arena-AI.apk"
            cp "$REL_APK" "Arena-AI_v$VERSION.apk"
            ASSETS+=("Arena-AI.apk" "Arena-AI_v$VERSION.apk")
          }

          add_debug_assets() {
            cp "$DBG_APK" "Arena-AI-debug.apk"
            cp "$DBG_APK" "Arena-AI_v$VERSION-debug.apk"
            ASSETS+=("Arena-AI-debug.apk" "Arena-AI_v$VERSION-debug.apk")
          }

          case "$MODE" in
            release)
              if [[ "$HAS_KEYSTORE" == true ]]; then
                build_release; add_release_assets
                VARIANT="signed release"
              elif [[ "$ALLOW_UNSIGNED" == true ]]; then
                echo "::warning::Signing secrets missing: publishing a debug APK instead of the release."
                build_debug; add_debug_assets
                VARIANT="debug (firma assente)"
              else
                echo "::error::Signing secrets missing and allow_unsigned disabled: no APK published."
                exit 1
              fi
              ;;
            debug)
              build_debug; add_debug_assets
              VARIANT="debug"
              ;;
            both)
              if [[ "$HAS_KEYSTORE" == true ]]; then
                build_release; add_release_assets
                build_debug; add_debug_assets
                VARIANT="signed release + debug"
              elif [[ "$ALLOW_UNSIGNED" == true ]]; then
                echo "::warning::Signing secrets missing: publishing the debug APK only."
                build_debug; add_debug_assets
                VARIANT="debug (firma assente)"
              else
                echo "::error::Signing secrets missing and allow_unsigned disabled: no APK published."
                exit 1
              fi
              ;;
            *)
              echo "::error::Invalid build_type: $MODE (use release, debug or both)."
              exit 1
              ;;
          esac

          [[ ${#ASSETS[@]} -gt 0 ]] || { echo "::error::No APK to publish."; exit 1; }
          {
            echo "assets<<ASSETS_EOF"
            printf '%s\n' "${ASSETS[@]}"
            echo "ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "signed=$([[ "$VARIANT" == release* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          ls -lh "${ASSETS[@]}"

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          # The changelog is optional: when CHANGELOG.md has a section for this
          # version it becomes the release body, otherwise the recent commits do.
          VERSION="${{ steps.version.outputs.version }}"
          SECTION=""
          HEADING=""
          if [[ -f CHANGELOG.md ]]; then
            SECTION="$(awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d')"
            HEADING="$(grep -m1 -F "## [$VERSION]" CHANGELOG.md || true)"
          fi
          if [[ -z "$SECTION" ]]; then
            SECTION="$(git log --pretty=format:'- %s' -n 30 --no-merges)"
            [[ -n "$HEADING" ]] || HEADING="## $VERSION"
          fi
          # Release asset, like 1.1.8: only the notes for this version.
          {
            echo "$HEADING"
            echo
            echo "$SECTION"
          } > changelog.md
          {
            echo "section<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Arena AI v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.build.outputs.assets }}
            changelog.md
          fail_on_unmatched_files: true
          body: |
            ## Arena AI v${{ steps.version.outputs.version }}

            _To receive a notification when a new release is available, click on **Watch > Custom > Releases** at the top._

            **Channel:** `${{ steps.version.outputs.channel }}` · **versionCode:** `${{ steps.version.outputs.version_code }}` · **Build:** ${{ steps.build.outputs.variant }}

            ${{ steps.changelog.outputs.section }}

            ---
            Automatic build from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
